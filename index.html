<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 프로젝트 발표</title>
<style>
:root{color-scheme:light;--page:#f2f4f7;--card:#fff;--ink:#152033;--sub:#5a6577;--line:#e2e6ec;--navy:#0c2340;--blue:#2a6fd6;--green:#16915a}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:22px 28px}
header h1{margin:0;font-size:26px}
header p{margin:4px 0 0;opacity:.85;font-size:15px}
main{max-width:900px;margin:0 auto;padding:24px 16px;display:grid;gap:16px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:20px 22px;text-decoration:none;color:var(--ink)}
a.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
a.card b{font-size:21px;display:block}
a.card span{color:var(--sub);font-size:15px}
</style>
</head>
<body>
<header>
  <h1>AI 프로젝트 발표</h1>
  <p>조선해양 현장 적용 · 2026-10</p>
</header>
<main>
  <a class="card" style="--c:var(--blue)" href="safety.html">
    <b>⚓ 1. 선박 위험작업 AI 모니터링</b>
    <span>CCTV 영상 → 딥러닝 4종 + 안전 규칙</span>
  </a>
  <a class="card" style="--c:var(--green)" href="fuel.html">
    <b>🧭 2. 항로·연료 AI 예측</b>
    <span>Noon Report → 머신러닝·딥러닝 비교 → 항차 계획</span>
  </a>
</main>
</body>
</html>
